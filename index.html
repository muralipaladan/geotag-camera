<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GPS ക്യാമറ &amp; മാപ്പ്</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#2f6fed"/>
<link rel="icon" href="icon-192.png"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#0e1013; --panel:#171a1f; --panel2:#1f232a; --accent:#2f6fed;
  --accent2:#3ba55d; --orange:#ffb020; --text:#f2f3f5; --muted:#9aa2ad;
  --danger:#e5484d;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font-family:'Noto Sans Malayalam','Segoe UI',Roboto,sans-serif; overflow:hidden;}
#app{position:fixed; inset:0; display:flex; flex-direction:column;}
.view{flex:1; display:none; position:relative; overflow:hidden;}
.view.active{display:flex; flex-direction:column;}

/* ---------- CAMERA ---------- */
#view-camera{background:#000;}
#camWrap{position:relative; flex:1; overflow:hidden; background:#000;}
#video{width:100%; height:100%; object-fit:cover; display:block;}
#camCanvas{display:none;}
#resultImg{width:100%; height:100%; object-fit:contain; display:none; background:#000;}
.camTopBar{position:absolute; top:0; left:0; right:0; padding:12px 14px;
  display:flex; justify-content:space-between; align-items:center;
  background:linear-gradient(180deg,rgba(0,0,0,.65),transparent); z-index:5;}
.camTopBar .siteLabel{font-size:13px; color:#fff; background:rgba(0,0,0,.4);
  padding:5px 10px; border-radius:8px;}
.gpsStatus{font-size:12px; padding:5px 10px; border-radius:8px; background:rgba(0,0,0,.4);}
.gpsStatus.ok{color:#7CFC9A;} .gpsStatus.wait{color:var(--orange);} .gpsStatus.err{color:var(--danger);}

.noteBar{position:absolute; left:12px; right:12px; bottom:96px; z-index:6;}
.noteBar input{width:100%; padding:10px 12px; border-radius:10px; border:1px solid #333;
  background:rgba(20,22,26,.85); color:#fff; font-size:14px;}
.noteBar input::placeholder{color:var(--muted);}

.camControls{position:absolute; bottom:0; left:0; right:0; padding:16px 20px 22px;
  display:flex; align-items:center; justify-content:space-between; z-index:6;
  background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);}
.shutterBtn{width:70px;height:70px;border-radius:50%;background:#fff;border:4px solid #ccc;
  display:flex;align-items:center;justify-content:center;}
.shutterBtn:active{transform:scale(.93);}
.shutterInner{width:56px;height:56px;border-radius:50%;background:#fff;border:2px solid #222;}
.smallBtn{width:46px;height:46px;border-radius:50%;background:rgba(30,32,38,.85);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;border:1px solid #333;}
.smallBtn.active{background:var(--orange); color:#000;}

.zoomWrap{position:absolute; right:10px; bottom:170px; z-index:6; display:flex;
  flex-direction:column; align-items:center; gap:4px;}
.zoomWrap input[type=range]{writing-mode:vertical-lr; direction:rtl; width:34px; height:110px;
  accent-color:var(--orange);}
.zoomWrap .zLabel{font-size:11px; color:#fff; background:rgba(0,0,0,.5); padding:2px 6px; border-radius:6px;}

.focusRing{position:absolute; width:64px; height:64px; border:2px solid var(--orange);
  border-radius:50%; z-index:7; pointer-events:none; opacity:0; transition:opacity .3s, transform .3s;}
.focusRing.show{opacity:1;}

.resultActions{position:absolute; bottom:0; left:0; right:0; padding:16px 18px 22px;
  display:flex; gap:10px; z-index:6; background:linear-gradient(0deg,rgba(0,0,0,.75),transparent);}
.resultActions button{flex:1; padding:13px; border-radius:12px; border:none; font-size:15px; font-weight:600;}
.btnRetake{background:var(--panel2); color:#fff;}
.btnSave{background:var(--accent2); color:#fff;}
.btnDownload{background:var(--accent); color:#fff;}

/* ---------- GALLERY ---------- */
#view-gallery{background:var(--bg); padding:14px; overflow-y:auto;}
.galHead{font-size:18px; font-weight:700; margin-bottom:12px;}
.galGrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding-bottom:80px;}
.galItem{position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden; background:var(--panel);}
.galItem img{width:100%; height:100%; object-fit:cover;}
.galEmpty{color:var(--muted); text-align:center; margin-top:60px; font-size:14px;}

/* full view */
#fullView{position:fixed; inset:0; background:#000; z-index:50; display:none; flex-direction:column;}
#fullView img{width:100%; flex:1; object-fit:contain;}
.fullBar{display:flex; justify-content:space-between; padding:14px 16px;
  background:var(--panel); align-items:center;}
.fullBar button{background:none; border:none; color:#fff; font-size:15px; font-weight:600;}
.fullBar .del{color:var(--danger);}

/* ---------- MAP ---------- */
#view-map{background:var(--bg);}
#leafletMap{flex:1; width:100%;}
.locateBtn{position:absolute; top:16px; right:16px; z-index:400; width:46px; height:46px;
  border-radius:12px; background:var(--accent); color:#fff; border:none;
  display:flex; align-items:center; justify-content:center; font-size:20px;
  box-shadow:0 3px 10px rgba(0,0,0,.4);}
.mapCoordBadge{position:absolute; left:12px; bottom:70px; z-index:400; background:rgba(15,16,20,.85);
  color:var(--orange); padding:8px 12px; border-radius:10px; font-size:13px; font-weight:600;
  border:1px solid #2a2d33;}

/* ---------- BOTTOM NAV ---------- */
.bottomnav{display:flex; background:var(--panel); border-top:1px solid #262930;
  padding:8px 0 max(8px, env(safe-area-inset-bottom)); z-index:20;}
.bottomnav button{flex:1; background:none; border:none; color:var(--muted);
  display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; padding:6px 0;}
.bottomnav button.active{color:var(--accent);}
.bottomnav .icon{font-size:20px;}

/* toast */
#toast{position:fixed; left:50%; bottom:110px; transform:translateX(-50%);
  background:#222; color:#fff; padding:10px 18px; border-radius:20px; font-size:13px;
  z-index:100; opacity:0; transition:opacity .25s; pointer-events:none;}
#toast.show{opacity:1;}

.hidden{display:none !important;}
</style>
</head>
<body>
<div id="app">

  <!-- CAMERA VIEW -->
  <div class="view active" id="view-camera">
    <div id="camWrap">
      <video id="video" autoplay playsinline muted></video>
      <img id="resultImg"/>
      <canvas id="camCanvas"></canvas>

      <div class="camTopBar">
        <div class="siteLabel" contenteditable="true" id="siteName">സൈറ്റ് പേര് ചേർക്കുക</div>
        <div class="gpsStatus wait" id="gpsStatus">GPS തിരയുന്നു...</div>
      </div>

      <div class="noteBar" id="noteBar">
        <input type="text" id="noteInput" placeholder="കുറിപ്പ് / Note ചേർക്കുക..." maxlength="120"/>
      </div>

      <div class="zoomWrap hidden" id="zoomWrap">
        <span class="zLabel" id="zoomLabel">1.0x</span>
        <input type="range" id="zoomSlider" min="1" max="1" step="0.1" value="1"/>
      </div>
      <div class="focusRing" id="focusRing"></div>

      <div class="camControls" id="camControls">
        <div class="smallBtn" id="switchCamBtn">🔄</div>
        <div class="shutterBtn" id="shutterBtn"><div class="shutterInner"></div></div>
        <div class="smallBtn" id="flashBtn">⚡</div>
      </div>

      <div class="resultActions hidden" id="resultActions">
        <button class="btnRetake" id="retakeBtn">വീണ്ടും എടുക്കുക</button>
        <button class="btnDownload" id="downloadBtn">Download</button>
        <button class="btnSave" id="saveBtn">സേവ് ചെയ്യുക</button>
      </div>
    </div>
  </div>

  <!-- GALLERY VIEW -->
  <div class="view" id="view-gallery">
    <div class="galHead">📸 ഗാലറി</div>
    <div class="galGrid" id="galGrid"></div>
    <div class="galEmpty hidden" id="galEmpty">ഇതുവരെ ഫോട്ടോകൾ ഒന്നും സേവ് ചെയ്തിട്ടില്ല</div>
  </div>

  <!-- MAP VIEW -->
  <div class="view" id="view-map">
    <div id="leafletMap"></div>
    <button class="locateBtn" id="locateBtn">🎯</button>
    <div class="mapCoordBadge hidden" id="mapCoordBadge"></div>
  </div>

  <nav class="bottomnav">
    <button class="navBtn active" data-view="camera"><span class="icon">📷</span>Camera</button>
    <button class="navBtn" data-view="gallery"><span class="icon">🖼️</span>Gallery</button>
    <button class="navBtn" data-view="map"><span class="icon">🗺️</span>Map</button>
  </nav>
</div>

<!-- FULL PHOTO VIEW -->
<div id="fullView">
  <div class="fullBar">
    <button id="fullClose">← തിരികെ</button>
    <button class="del" id="fullDelete">ഡിലീറ്റ്</button>
  </div>
  <img id="fullImg"/>
</div>

<div id="toast"></div>
<div id="qrBuild" style="position:fixed; left:-9999px; top:-9999px;"></div>

<script>
/* ============ UTILS ============ */
function toast(msg,ms=1800){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),ms);
}
function pad(n){return n.toString().padStart(2,'0');}
function fmtDateTime(d){
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let h=d.getHours(); const ampm=h>=12?'pm':'am'; h=h%12; if(h===0)h=12;
  return `${pad(d.getDate())}-${months[d.getMonth()]}-${d.getFullYear()}  ${pad(h)}:${pad(d.getMinutes())}:${pad(d.getSeconds())} ${ampm}`;
}

/* ============ INDEXEDDB ============ */
let db;
const DB_NAME='gpsCameraDB', STORE='photos';
function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,1);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains(STORE)){
        d.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});
      }
    };
    req.onsuccess=e=>{db=e.target.result; resolve();};
    req.onerror=e=>reject(e);
  });
}
function savePhoto(record){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,'readwrite');
    const st=tx.objectStore(STORE);
    const r=st.add(record);
    r.onsuccess=()=>resolve(r.result);
    r.onerror=e=>reject(e);
  });
}
function getAllPhotos(){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,'readonly');
    const st=tx.objectStore(STORE);
    const r=st.getAll();
    r.onsuccess=()=>resolve(r.result.reverse());
    r.onerror=e=>reject(e);
  });
}
function deletePhoto(id){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete=()=>resolve();
    tx.onerror=e=>reject(e);
  });
}

/* ============ NAVIGATION ============ */
const views={camera:document.getElementById('view-camera'),
  gallery:document.getElementById('view-gallery'),
  map:document.getElementById('view-map')};
document.querySelectorAll('.navBtn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.navBtn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    Object.values(views).forEach(v=>v.classList.remove('active'));
    const key=btn.dataset.view;
    views[key].classList.add('active');
    if(key==='gallery') loadGallery();
    if(key==='map') { setTimeout(()=>{ map && map.invalidateSize(); },80); locateOnMap(); }
  });
});

/* ============ CAMERA ============ */
let stream, facingMode='environment';
const video=document.getElementById('video');
const resultImg=document.getElementById('resultImg');
const canvas=document.getElementById('camCanvas');
const shutterBtn=document.getElementById('shutterBtn');
const camControls=document.getElementById('camControls');
const resultActions=document.getElementById('resultActions');
const noteBar=document.getElementById('noteBar');
const gpsStatusEl=document.getElementById('gpsStatus');

let currentPos=null, watchId=null;

function startGPS(){
  if(!navigator.geolocation){
    gpsStatusEl.textContent='GPS ലഭ്യമല്ല'; gpsStatusEl.className='gpsStatus err'; return;
  }
  gpsStatusEl.textContent='GPS തിരയുന്നു...'; gpsStatusEl.className='gpsStatus wait';
  watchId=navigator.geolocation.watchPosition(pos=>{
    currentPos=pos;
    gpsStatusEl.textContent=`±${Math.round(pos.coords.accuracy)}m`;
    gpsStatusEl.className='gpsStatus ok';
  }, err=>{
    gpsStatusEl.textContent='GPS പിശക്'; gpsStatusEl.className='gpsStatus err';
  }, {enableHighAccuracy:true, maximumAge:2000, timeout:15000});
}
startGPS();

let videoTrack=null, torchOn=false, zoomCaps=null;

async function startCamera(){
  try{
    if(stream) stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode, width:{ideal:1280}, height:{ideal:1920}}, audio:false
    });
    video.srcObject=stream;
    videoTrack=stream.getVideoTracks()[0];
    torchOn=false;
    document.getElementById('flashBtn').classList.remove('active');
    setupZoom();
    setupTorchAvailability();
  }catch(e){
    toast('ക്യാമറ ആക്സസ് ചെയ്യാൻ കഴിഞ്ഞില്ല');
  }
}
startCamera();
document.getElementById('switchCamBtn').addEventListener('click',()=>{
  facingMode=facingMode==='environment'?'user':'environment';
  startCamera();
});

/* ---- Flash / Torch ---- */
function setupTorchAvailability(){
  const flashBtn=document.getElementById('flashBtn');
  try{
    const caps=videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
    if(caps.torch){ flashBtn.style.display='flex'; }
    else{ flashBtn.style.display='flex'; flashBtn.dataset.unsupported='1'; }
  }catch(e){ flashBtn.dataset.unsupported='1'; }
}
document.getElementById('flashBtn').addEventListener('click', async ()=>{
  if(!videoTrack) return;
  const flashBtn=document.getElementById('flashBtn');
  try{
    torchOn=!torchOn;
    await videoTrack.applyConstraints({advanced:[{torch:torchOn}]});
    flashBtn.classList.toggle('active',torchOn);
  }catch(e){
    torchOn=false;
    toast('ഈ ഡിവൈസിൽ Flash control ലഭ്യമല്ല');
  }
});

/* ---- Zoom (pinch + slider) ---- */
function setupZoom(){
  const zoomWrap=document.getElementById('zoomWrap');
  const slider=document.getElementById('zoomSlider');
  try{
    const caps=videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
    if(caps.zoom){
      zoomCaps=caps.zoom;
      slider.min=caps.zoom.min; slider.max=caps.zoom.max; slider.step=caps.zoom.step||0.1;
      const settings=videoTrack.getSettings();
      slider.value=settings.zoom||caps.zoom.min;
      document.getElementById('zoomLabel').textContent=parseFloat(slider.value).toFixed(1)+'x';
      zoomWrap.classList.remove('hidden');
    }else{
      zoomCaps=null; zoomWrap.classList.add('hidden');
    }
  }catch(e){ zoomCaps=null; zoomWrap.classList.add('hidden'); }
}
document.getElementById('zoomSlider').addEventListener('input',async(e)=>{
  const val=parseFloat(e.target.value);
  document.getElementById('zoomLabel').textContent=val.toFixed(1)+'x';
  if(videoTrack && zoomCaps){
    try{ await videoTrack.applyConstraints({advanced:[{zoom:val}]}); }catch(err){}
  }
});
// Pinch-to-zoom on video
let pinchStartDist=null, pinchStartZoom=1;
function touchDist(t){ return Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY); }
document.getElementById('camWrap').addEventListener('touchstart',(e)=>{
  if(e.touches.length===2 && zoomCaps){
    pinchStartDist=touchDist(e.touches);
    pinchStartZoom=parseFloat(document.getElementById('zoomSlider').value);
  }
},{passive:true});
document.getElementById('camWrap').addEventListener('touchmove',async(e)=>{
  if(e.touches.length===2 && zoomCaps && pinchStartDist){
    const dist=touchDist(e.touches);
    const scale=dist/pinchStartDist;
    let newZoom=pinchStartZoom*scale;
    newZoom=Math.max(zoomCaps.min, Math.min(zoomCaps.max, newZoom));
    const slider=document.getElementById('zoomSlider');
    slider.value=newZoom;
    document.getElementById('zoomLabel').textContent=newZoom.toFixed(1)+'x';
    try{ await videoTrack.applyConstraints({advanced:[{zoom:newZoom}]}); }catch(err){}
  }
},{passive:true});
document.getElementById('camWrap').addEventListener('touchend',(e)=>{
  if(e.touches.length<2) pinchStartDist=null;
});

/* ---- Tap-to-focus ---- */
document.getElementById('camWrap').addEventListener('click',async(e)=>{
  if(e.target.closest('.camTopBar') || e.target.closest('.noteBar') || e.target.closest('.camControls') || e.target.closest('.zoomWrap')) return;
  const ring=document.getElementById('focusRing');
  ring.style.left=(e.clientX-32)+'px';
  ring.style.top=(e.clientY-32)+'px';
  ring.classList.remove('show'); void ring.offsetWidth; ring.classList.add('show');
  setTimeout(()=>ring.classList.remove('show'),700);
  if(videoTrack){
    try{
      const caps=videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
      if(caps.focusMode && caps.focusMode.includes('single-shot')){
        await videoTrack.applyConstraints({advanced:[{focusMode:'single-shot'}]});
      }
    }catch(err){}
  }
});

function decToDMS(deg,isLat){
  const dir=isLat?(deg>=0?'N':'S'):(deg>=0?'E':'W');
  return `${Math.abs(deg).toFixed(6)}° ${dir}`;
}

function buildQR(text){
  return new Promise(resolve=>{
    const holder=document.getElementById('qrBuild');
    holder.innerHTML='';
    new QRCode(holder,{text:text, width:240, height:240, correctLevel:QRCode.CorrectLevel.M});
    setTimeout(()=>{
      const img=holder.querySelector('img') || holder.querySelector('canvas');
      resolve(img);
    },120);
  });
}

let lastComposedDataURL=null, lastMeta=null;

async function capturePhoto(){
  if(!video.videoWidth){ toast('ക്യാമറ തയ്യാറല്ല'); return; }
  const w=video.videoWidth, h=video.videoHeight;
  canvas.width=w; canvas.height=h;
  const ctx=canvas.getContext('2d');
  ctx.drawImage(video,0,0,w,h);

  const now=new Date();
  let lat=null,lon=null,acc=null;
  if(currentPos){
    lat=currentPos.coords.latitude; lon=currentPos.coords.longitude; acc=currentPos.coords.accuracy;
  }
  const note=document.getElementById('noteInput').value.trim();
  const siteName=document.getElementById('siteName').textContent.trim() || 'സൈറ്റ് പേര് നൽകിയിട്ടില്ല';

  // ---- overlay bar ----
  const barH=Math.round(h*0.16);
  ctx.fillStyle='rgba(0,0,0,0.72)';
  ctx.fillRect(0,h-barH,w,barH);

  const padX=w*0.035;
  let ty=h-barH+ (barH*0.28);
  const coordFont=Math.round(w*0.042);
  const smallFont=Math.round(w*0.026);

  ctx.textBaseline='top';
  if(lat!==null){
    ctx.fillStyle='#ffb020';
    ctx.font=`bold ${coordFont}px Arial`;
    ctx.fillText(`${decToDMS(lat,true)}, ${decToDMS(lon,false)}`, padX, ty);
    ty += coordFont*1.15;
  }else{
    ctx.fillStyle='#ffb020';
    ctx.font=`bold ${coordFont*0.8}px Arial`;
    ctx.fillText('GPS ലഭ്യമല്ല', padX, ty);
    ty += coordFont*1.15;
  }

  ctx.fillStyle='#ffffff';
  ctx.font=`${smallFont}px Arial`;
  ctx.fillText(`Date & Time: ${fmtDateTime(now)}`, padX, ty);
  ty += smallFont*1.5;

  ctx.font=`bold ${smallFont*1.1}px Arial`;
  ctx.fillText(siteName, padX, ty);
  ty += smallFont*1.4;

  if(note){
    ctx.fillStyle='#8fd3ff';
    ctx.font=`${smallFont}px Arial`;
    ctx.fillText(`Note: ${note}`, padX, ty);
  }
  if(acc){
    ctx.fillStyle='#9aa2ad';
    ctx.font=`${smallFont*0.8}px Arial`;
    ctx.textAlign='right';
    ctx.fillText(`±${Math.round(acc)}m accuracy`, w-padX, h-barH+8);
    ctx.textAlign='left';
  }

  // ---- QR code ----
  let qrText='GPS ലഭ്യമല്ല';
  if(lat!==null){
    qrText=`https://maps.google.com/?q=${lat.toFixed(6)},${lon.toFixed(6)}`;
  }
  const qrEl=await buildQR(qrText);
  const qrSize=Math.round(barH*0.85);
  const qrX=w-qrSize-padX, qrY=h-barH+(barH-qrSize)/2;
  if(qrEl){
    ctx.fillStyle='#fff';
    ctx.fillRect(qrX-6,qrY-6,qrSize+12,qrSize+12);
    ctx.drawImage(qrEl, qrX, qrY, qrSize, qrSize);
  }
  ctx.fillStyle='#cfd3d8';
  ctx.font=`${Math.round(w*0.018)}px Arial`;
  ctx.textAlign='center';
  ctx.fillText('GPS MAP QR', qrX+qrSize/2, qrY+qrSize+6);
  ctx.textAlign='left';

  lastComposedDataURL=canvas.toDataURL('image/jpeg',0.92);
  lastMeta={lat,lon,acc,note,siteName,time:now.toISOString()};

  resultImg.src=lastComposedDataURL;
  resultImg.style.display='block';
  video.style.display='none';
  camControls.classList.add('hidden');
  noteBar.classList.add('hidden');
  resultActions.classList.remove('hidden');
}

shutterBtn.addEventListener('click',capturePhoto);

document.getElementById('retakeBtn').addEventListener('click',()=>{
  resultImg.style.display='none';
  video.style.display='block';
  camControls.classList.remove('hidden');
  noteBar.classList.remove('hidden');
  resultActions.classList.add('hidden');
});

document.getElementById('saveBtn').addEventListener('click',async ()=>{
  if(!lastComposedDataURL) return;
  await savePhoto({img:lastComposedDataURL, ...lastMeta});
  toast('ഫോട്ടോ സേവ് ചെയ്തു ✔');
  document.getElementById('retakeBtn').click();
  document.getElementById('noteInput').value='';
});

document.getElementById('downloadBtn').addEventListener('click',()=>{
  if(!lastComposedDataURL) return;
  const a=document.createElement('a');
  a.href=lastComposedDataURL;
  a.download=`GPS_Photo_${Date.now()}.jpg`;
  a.click();
});

/* ============ GALLERY ============ */
async function loadGallery(){
  const grid=document.getElementById('galGrid');
  const empty=document.getElementById('galEmpty');
  const items=await getAllPhotos();
  grid.innerHTML='';
  if(!items.length){ empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  items.forEach(it=>{
    const div=document.createElement('div');
    div.className='galItem';
    div.innerHTML=`<img src="${it.img}"/>`;
    div.addEventListener('click',()=>openFull(it));
    grid.appendChild(div);
  });
}
function openFull(it){
  document.getElementById('fullImg').src=it.img;
  document.getElementById('fullView').style.display='flex';
  document.getElementById('fullDelete').onclick=async()=>{
    await deletePhoto(it.id);
    document.getElementById('fullView').style.display='none';
    loadGallery();
    toast('ഡിലീറ്റ് ചെയ്തു');
  };
}
document.getElementById('fullClose').addEventListener('click',()=>{
  document.getElementById('fullView').style.display='none';
});

/* ============ MAP ============ */
let map, marker, mapInited=false;
function initMap(){
  if(mapInited) return; mapInited=true;
  map=L.map('leafletMap',{zoomControl:false}).setView([10.0,76.3],14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19, attribution:'© OpenStreetMap'
  }).addTo(map);
  const greenIcon=L.divIcon({
    className:'',
    html:'<div style="font-size:34px;line-height:34px;">📍</div>',
    iconSize:[34,34], iconAnchor:[17,32]
  });
  marker=L.marker([10.0,76.3],{icon:greenIcon}).addTo(map);
}
initMap();

function locateOnMap(){
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude,longitude,accuracy}=pos.coords;
    map.setView([latitude,longitude],17);
    marker.setLatLng([latitude,longitude]);
    const badge=document.getElementById('mapCoordBadge');
    badge.textContent=`${latitude.toFixed(6)}° N, ${longitude.toFixed(6)}° E  (±${Math.round(accuracy)}m)`;
    badge.classList.remove('hidden');
  }, ()=>{ toast('ലൊക്കേഷൻ ലഭ്യമല്ല'); }, {enableHighAccuracy:true, timeout:15000});
}
document.getElementById('locateBtn').addEventListener('click',locateOnMap);
